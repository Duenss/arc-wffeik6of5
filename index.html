<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Archivo Free Fire</title>
<style>
  :root { --bg:#0b0f17; --panel:#141b27; --line:#243044; --text:#e6edf7; --dim:#8b9bb4; --accent:#ffba00; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { position:sticky; top:0; z-index:5; background:rgba(11,15,23,.95); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); padding:14px clamp(12px,3vw,32px); }
  h1 { margin:0 0 10px; font-size:17px; letter-spacing:.06em; }
  h1 span { color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; }
  input, select { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px;
                  padding:8px 10px; font:inherit; outline:none; }
  input { flex:1 1 240px; }
  input:focus, select:focus { border-color:var(--accent); }
  #count { color:var(--dim); align-self:center; margin-left:auto; white-space:nowrap; }
  main { padding:18px clamp(12px,3vw,32px) 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; cursor:pointer;
          transition:border-color .15s, transform .15s; min-width:0; }
  .card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .thumb { aspect-ratio:1; display:grid; place-items:center; background:#0e1420; border-radius:8px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .thumb .noimg { color:#3d4b60; font-size:11px; }
  .name { margin-top:8px; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { display:flex; justify-content:space-between; gap:6px; color:var(--dim); font-size:11px; margin-top:3px; }
  .meta b { color:var(--accent); font-weight:600; }
  .more { display:block; margin:26px auto 0; background:var(--panel); color:var(--text); border:1px solid var(--line);
          border-radius:9px; padding:11px 26px; font:inherit; cursor:pointer; }
  .more:hover { border-color:var(--accent); }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:14px;
           padding:18px; width:min(460px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.72); }
  .modal-top { display:flex; gap:14px; align-items:flex-start; }
  .modal-top img { width:128px; height:128px; object-fit:contain; background:#0e1420; border-radius:10px; flex:0 0 auto; }
  .modal-top h2 { margin:0 0 8px; font-size:16px; overflow-wrap:anywhere; }
  .idline { display:flex; align-items:center; gap:8px; margin:5px 0; flex-wrap:wrap; font-size:12px; color:var(--dim); }
  .idline code { background:#0e1420; color:var(--text); padding:3px 7px; border-radius:6px; font-size:12px; }
  .copy { background:var(--accent); color:#111; border:0; border-radius:6px; padding:4px 8px; cursor:pointer; font-weight:600; font-size:11px; }
  .desc { margin-top:14px; color:var(--dim); max-height:160px; overflow:auto; white-space:pre-wrap; }
  .close { margin-top:16px; width:100%; background:#1d2737; color:var(--text); border:1px solid var(--line);
           border-radius:8px; padding:9px; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<header>
  <h1>ARCHIVO <span>FREE FIRE</span></h1>
  <div class="controls">
    <input id="q" type="search" placeholder="Buscar nombre, item ID, icon ID o descripcion...">
    <select id="cat"><option value="">Todas las categorias</option></select>
    <select id="type"><option value="">Todos los tipos</option></select>
    <select id="rare"><option value="">Todas las rarezas</option></select>
    <select id="tag"><option value="">Todos los tags</option></select>
    <span id="count"></span>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Cargar mas</button>
</main>
<dialog id="modal">
  <div class="modal-top">
    <img id="mImg" alt="">
    <div>
      <h2 id="mName"></h2>
      <div class="idline">Item ID <code id="mId"></code><button class="copy" id="mIdCopy">Copiar</button></div>
      <div class="idline">Icon ID <code id="mIcon"></code><button class="copy" id="mIconCopy">Copiar</button></div>
      <div class="idline"><span id="mCat"></span> · <span id="mType"></span> · <span id="mRare"></span></div>
      <div class="idline"><span id="mTag"></span></div>
    </div>
  </div>
  <p class="desc" id="mDesc"></p>
  <button class="close" id="mClose">Cerrar</button>
</dialog>
<script>
const PAGE = 120;
const RAW = 'https://raw.githubusercontent.com/ShahGCreator/icon/main/PNG/';
const JSD = 'https://cdn.jsdelivr.net/gh/ShahGCreator/icon@main/PNG/';
let items = [], view = [], shown = 0;
const $ = id => document.getElementById(id);

fetch('items.json').then(r => r.json()).then(data => {
  items = data;
  const uniq = (key) => [...new Set(items.map(i => i[key]).filter(Boolean))].sort();
  for (const c of uniq('c')) $('cat').add(new Option(c, c));
  for (const t of uniq('t')) $('type').add(new Option(t, t));
  for (const r of uniq('r')) $('rare').add(new Option(r, r));
  for (const g of uniq('g')) $('tag').add(new Option(g, g));
  apply();
});

function apply() {
  const q = $('q').value.trim().toLowerCase();
  const c = $('cat').value, t = $('type').value, r = $('rare').value, g = $('tag').value;
  view = items.filter(i =>
    (!c || i.c === c) && (!t || i.t === t) && (!r || i.r === r) && (!g || i.g === g) &&
    (!q || (i.n + ' ' + i.i + ' ' + i.x + ' ' + i.d).toLowerCase().includes(q))
  );
  $('count').textContent = view.length.toLocaleString('en-US') + ' items';
  $('grid').innerHTML = ''; shown = 0; $('more').hidden = true; render();
}

function imageFor(id) {
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.alt = '';
  img.src = RAW + id + '.png';
  img.addEventListener('error', () => {
    if (!img.dataset.fb) { img.dataset.fb = '1'; img.src = JSD + id + '.png'; }
    else { img.remove(); }
  });
  return img;
}

function render() {
  const batch = view.slice(shown, shown + PAGE);
  const frag = document.createDocumentFragment();
  for (const i of batch) {
    const card = document.createElement('div');
    card.className = 'card';
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    if (i.m) thumb.appendChild(imageFor(i.i));
    else { const s = document.createElement('span'); s.className = 'noimg'; s.textContent = 'sin imagen'; thumb.appendChild(s); }
    const name = document.createElement('div');
    name.className = 'name'; name.title = i.n; name.textContent = i.n;
    const meta = document.createElement('div');
    meta.className = 'meta';
    const cat = document.createElement('span'); cat.textContent = i.c;
    const id = document.createElement('b'); id.textContent = i.i;
    meta.append(cat, id);
    card.append(thumb, name, meta);
    card.onclick = () => openItem(i);
    frag.appendChild(card);
  }
  $('grid').appendChild(frag);
  shown += batch.length;
  $('more').hidden = shown >= view.length;
}

function openItem(i) {
  $('mName').textContent = i.n;
  $('mId').textContent = i.i;
  $('mIcon').textContent = i.x || '(sin icon id)';
  $('mCat').textContent = i.c;
  $('mType').textContent = i.t;
  $('mRare').textContent = i.r;
  $('mTag').textContent = i.g || '';
  $('mDesc').textContent = i.d || 'Sin descripcion.';
  const box = $('mImg');
  if (i.m) {
    box.style.display = 'block';
    box.dataset.fb = '';
    box.src = RAW + i.i + '.png';
    box.onerror = () => {
      if (!box.dataset.fb) { box.dataset.fb = '1'; box.src = JSD + i.i + '.png'; }
      else { box.style.display = 'none'; }
    };
  } else {
    box.style.display = 'none';
  }
  $('modal').showModal();
}

function copyBtn(btn, value) {
  btn.onclick = async () => {
    try { await navigator.clipboard.writeText(value()); } catch (e) {}
    const old = btn.textContent;
    btn.textContent = 'Copiado';
    setTimeout(() => btn.textContent = old, 1200);
  };
}
copyBtn($('mIdCopy'), () => $('mId').textContent);
copyBtn($('mIconCopy'), () => $('mIcon').textContent);

$('q').addEventListener('input', apply);
for (const id of ['cat', 'type', 'rare', 'tag']) $(id).addEventListener('change', apply);
$('more').addEventListener('click', render);
$('mClose').addEventListener('click', () => $('modal').close());
</script>
</body>
</html>
